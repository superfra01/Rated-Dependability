services:
  webapp:
    # Builds the application image from the local Dockerfile.
    build: .
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      CATALINA_OPTS: >-
        -DDB_HOST=${DB_HOST:-db_service}
        -DDB_PORT=${DB_PORT:-3306}
        -DDB_NAME=${DB_NAME:-RatedDB}
        -DDB_USERNAME=${DB_USERNAME:?Set DB_USERNAME in .env}
        -DDB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      db_service:
        condition: service_healthy
    networks:
      - rated-network

  db_service:
    image: mysql:8.0.44
    restart: unless-stopped
    environment:
      LANG: C.UTF-8
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-RatedDB}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - rated-network

  # Optional local administration interface: docker compose --profile tools up
  db_gui:
    image: adminer:4.8.1
    profiles: ["tools"]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      db_service:
        condition: service_healthy
    networks:
      - rated-network

volumes:
  db_data:

networks:
  rated-network:
