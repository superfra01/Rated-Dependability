name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- GitGuardian  ---
      - name: GitGuardian scan (secrets)
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      # --- Snyk (install CLI) ---
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # --- Snyk Open Source (dipendenze Maven) ---
      - name: Snyk Open Source (dependencies)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=Rated/pom.xml --severity-threshold=high

      - name: Snyk Monitor (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --file=Rated/pom.xml

      # --- Snyk Code (SAST) ---
      # Userà le esclusioni del file .snyk
      - name: Snyk Code (SAST)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --report --project-name="Rated-Dependability-SAST"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Modificato in 17
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & test (Maven verify + JaCoCo)
        run: mvn -B -ntp -f Rated/pom.xml verify

      - name: Check JaCoCo XML exists
        run: ls -la Rated/target/site/jacoco/jacoco.xml

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp -f Rated/pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=rated \
            -Dsonar.projectKey=superfra01_Rated-Dependability \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.qualitygate.wait=false \
            -Dsonar.scanner.metadataFilePath="${GITHUB_WORKSPACE}/sonar-report-task.txt" \
            -Dsonar.coverage.exclusions=**/*

      - name: Require zero SonarCloud security issues
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: superfra01_Rated-Dependability
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          CE_TASK_URL=$(awk -F= '$1 == "ceTaskUrl" { print $2 }' sonar-report-task.txt)
          if [[ -z "$CE_TASK_URL" ]]; then
            echo "Impossibile trovare il task SonarCloud dell'analisi."
            exit 1
          fi

          for attempt in {1..60}; do
            TASK_RESPONSE=$(curl --silent --show-error --fail \
              --user "${SONAR_TOKEN}:" \
              "$CE_TASK_URL")
            TASK_STATUS=$(jq -r '.task.status' <<< "$TASK_RESPONSE")

            case "$TASK_STATUS" in
              SUCCESS)
                break
                ;;
              FAILED|CANCELED)
                echo "Elaborazione dell'analisi SonarCloud terminata con stato: $TASK_STATUS"
                exit 1
                ;;
            esac

            if [[ "$attempt" -eq 60 ]]; then
              echo "Timeout durante l'elaborazione dell'analisi SonarCloud."
              exit 1
            fi
            sleep 5
          done

          ISSUE_QUERY=(
            --get
            --data-urlencode "componentKeys=${SONAR_PROJECT_KEY}"
            --data-urlencode "impactSoftwareQualities=SECURITY"
            --data-urlencode "resolved=false"
            --data-urlencode "ps=1"
          )
          if [[ -n "$SONAR_PULL_REQUEST" ]]; then
            ISSUE_QUERY+=(--data-urlencode "pullRequest=${SONAR_PULL_REQUEST}")
          fi

          ISSUE_RESPONSE=$(curl --silent --show-error --fail \
            --user "${SONAR_TOKEN}:" \
            "${ISSUE_QUERY[@]}" \
            "https://sonarcloud.io/api/issues/search")
          SECURITY_ISSUES=$(jq -r '.paging.total' <<< "$ISSUE_RESPONSE")

          echo "Security issue SonarCloud aperte: $SECURITY_ISSUES"
          if [[ "$SECURITY_ISSUES" -ne 0 ]]; then
            echo "Il controllo di sicurezza richiede 0 issue aperte."
            exit 1
          fi

      - name: Mutation testing with PIT
        run: mvn -B -ntp -f Rated/pom.xml org.pitest:pitest-maven:mutationCoverage

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Rated/target/site/jacoco

      - name: Upload PIT mutation testing report
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: Rated/target/pit-reports

      - name: Build Docker image
        run: docker build Rated --file Rated/Dockerfile --tag rated-webapp:${{ github.sha }}
