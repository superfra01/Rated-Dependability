name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      OPENJML_VERSION: "21.0.27"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- GitGuardian  ---
      - name: GitGuardian scan (secrets)
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      # --- Snyk (install CLI) ---
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      # --- Snyk Open Source (dipendenze Maven) ---
      - name: Snyk Open Source (dependencies)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=Rated/pom.xml --severity-threshold=high

      - name: Snyk Monitor (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --file=Rated/pom.xml

      # --- Snyk Code (SAST) ---
      # Userà le esclusioni del file .snyk
      - name: Snyk Code (SAST)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --report --project-name="Rated-Dependability-SAST"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17' # Modificato in 17
          distribution: 'temurin'
          cache: 'maven'

      # --- OpenJML (formal verification) ---
      - name: Compile and build Maven classpath for OpenJML
        working-directory: Rated
        run: |
          mvn -B -ntp -DskipTests compile dependency:build-classpath \
            "-DincludeScope=compile" \
            "-Dmdep.outputFile=target/openjml-classpath.txt"

      - name: Cache OpenJML
        id: cache-openjml
        uses: actions/cache@v4
        with:
          path: ~/.openjml/${{ env.OPENJML_VERSION }}
          key: openjml-ubuntu-24.04-x64-${{ env.OPENJML_VERSION }}

      - name: Install OpenJML
        if: steps.cache-openjml.outputs.cache-hit != 'true'
        shell: bash
        run: |
          OPENJML_HOME="$HOME/.openjml/$OPENJML_VERSION"
          mkdir -p "$OPENJML_HOME"
          curl --fail --location --retry 3 \
            "https://github.com/OpenJML/OpenJML/releases/download/${OPENJML_VERSION}/openjml-ubuntu-24.04-${OPENJML_VERSION}.zip" \
            --output /tmp/openjml.zip
          unzip -q /tmp/openjml.zip -d "$OPENJML_HOME"
          chmod +x "$OPENJML_HOME/openjml"

      - name: Check OpenJML installation
        run: '"$HOME/.openjml/$OPENJML_VERSION/openjml" --version'

      - name: Verify JML specifications
        continue-on-error: true
        working-directory: Rated
        shell: bash
        run: |
          CLASSPATH="target/classes:$(cat target/openjml-classpath.txt)"
          # OpenJML 21 usa il JDK e le specifiche Java 21 incluse nel pacchetto.
          # La compatibilita Java 17 del progetto e gia verificata da Maven.
          "$HOME/.openjml/$OPENJML_VERSION/openjml" \
            --esc \
            --progress \
            --timeout=60 \
            --esc-max-warnings=1 \
            --class-path "$CLASSPATH" \
            --source-path src/main/java \
            --dir src/main/java

      - name: Build & test (Maven verify + JaCoCo)
        run: mvn -B -ntp -f Rated/pom.xml verify

      - name: Check JaCoCo XML exists
        run: ls -la Rated/target/site/jacoco/jacoco.xml

      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp -f Rated/pom.xml org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.organization=rated \
            -Dsonar.projectKey=superfra01_Rated-Dependability \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.exclusions=**/*

      - name: Mutation testing with PIT
        run: mvn -B -ntp -f Rated/pom.xml org.pitest:pitest-maven:mutationCoverage

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: Rated/target/site/jacoco

      - name: Upload PIT mutation testing report
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: Rated/target/pit-reports

      - name: Build Docker image
        run: docker build Rated --file Rated/Dockerfile --tag rated-webapp:${{ github.sha }}
